title: Draw a deployment diagram
url: "http://localhost:5183/#/fixtures%2Fdeployment-demo"
viewport: 1280x720
crop: {role: main}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - wait_for: {text: Orders DB, within: {role: application}}
  # Close the side panels the steps do not use, so the diagram is drawn larger.
  - click: {role: button, name: "Collapse panel", nth: 1}
  - click: {role: button, name: Fit View}
steps:
  - note: Select a node
    do:
      - click: {text: Orders DB, within: {role: application}}
  - note: Memberships puts it in a zone
    do:
      - box: {label: Add parent}
      - select: {label: Add parent, option: Private}
      - click: {role: button, name: Add, exact: true}
    pause: 1.5
