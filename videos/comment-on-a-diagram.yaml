title: Comment on a diagram
url: "http://localhost:5183/#/fixtures%2Fstudio-demo"
viewport: 1280x720
crop: {role: main}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - click: {text: Payments platform, within: {role: application}}
steps:
