title: Draw a plan
url: "http://localhost:5183/#/fixtures%2Fplan-demo"
viewport: 1280x720
crop: {role: main}
# The new zone's name box garbles keys typed before its layout lands, or typed fast: so let it
# settle, and fill it at a slower pace.
pace: {typing: 8}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - wait_for: {text: Build, within: {role: application}}
  # Close the side panels the steps do not use, so the diagram is drawn larger.
  - click: {role: button, name: "Collapse panel", nth: 1}
  - click: {role: button, name: "Collapse panel", nth: 0}
  - click: {role: button, name: Fit View}
  # Zoomed out, so what the steps add stays in the picture.
  - click: {role: button, name: Zoom Out}
  - click: {role: button, name: Zoom Out}
  - click: {role: button, name: Zoom Out}
steps:
  - note: Select a zone
    do:
      - click: {text: Build, within: {role: application}}
  - note: Its + adds the next zone, the same length
    do:
      - click: {role: button, name: Add the next zone, within: {role: application}}
    pause: 1
  - note: Its + adds the next zone, the same length
    do:
      - fill: {role: textbox, name: Edit text, within: {role: application}, value: Rollout}
      - press: Control+Enter
    pause: 1.5
