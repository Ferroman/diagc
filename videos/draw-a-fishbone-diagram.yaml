title: Draw a fishbone diagram
url: "http://localhost:5183/#/fixtures%2Ffishbone-demo"
viewport: 1280x720
crop: {role: main}
# A new cause's name box drops keys typed before its layout lands, or typed fast: so let it settle,
# and fill it at a slower pace.
pace: {typing: 8}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - wait_for: {text: Infrastructure, within: {role: application}}
  # Close the side panels the steps do not use, so the diagram is drawn larger.
  - click: {role: button, name: "Collapse panel", nth: 1}
  - click: {role: button, name: "Collapse panel", nth: 0}
  - click: {role: button, name: Fit View}
  # Zoomed out, so what the steps add stays in the picture.
  - click: {role: button, name: Zoom Out}
steps:
  - note: Select a bone
    do:
      - click: {text: Infrastructure, within: {role: application}}
  - note: Tab hangs a cause on it
    do:
      - press: Tab
    pause: 1
  - note: Tab hangs a cause on it
    do:
      - fill: {role: textbox, name: Rename, within: {role: application}, value: Single region}
  - note: Tab again hangs one on that cause
    do:
      - press: Tab
    pause: 1
  - note: Tab again hangs one on that cause
    do:
      - fill: {role: textbox, name: Rename, within: {role: application}, value: No failover test}
      - press: Enter
    pause: 1.5
