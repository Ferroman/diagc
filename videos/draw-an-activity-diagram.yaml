title: Draw an activity diagram
url: "http://localhost:5183/#/fixtures%2Factivity-demo"
viewport: 1280x720
crop: {role: main}
# A new lane's name box drops keys typed fast, so fill it at a slower pace.
pace: {typing: 8}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - wait_for: {text: Finance, within: {role: application}}
  # Close the side panels the steps do not use, so the diagram is drawn larger.
  - click: {role: button, name: "Collapse panel", nth: 0}
  - click: {role: button, name: Fit View}
steps:
  - note: Select a lane
    do:
      - click: {text: Finance, exact: true, within: {role: application}}
  - note: Its + adds a lane above it
    do:
      - click: {role: button, name: Add a lane above, within: {role: application}}
    pause: 1
  - note: Its + adds a lane above it
    do:
      - fill: {role: textbox, name: Rename, within: {role: application}, value: Employee}
      - press: Enter
  - note: Add an action to the selected lane
    do:
      - fill: {label: Element name, value: Submit a claim}
      - circle: {role: button, name: Add action}
      - click: {role: button, name: Add action}
    pause: 1.5
