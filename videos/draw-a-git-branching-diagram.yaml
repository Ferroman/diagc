title: Draw a git branching diagram
url: "http://localhost:5183/#/fixtures%2Fgit-graph-demo"
viewport: 1280x720
crop: {role: main}
# A new commit's tag box drops keys typed before its layout lands, or typed fast: so let it settle,
# and fill it at a slower pace.
pace: {typing: 8}
setup:
  - wait_for: {text: diagc studio}
  - click: {role: button, name: "Switch to light theme"}
  - click: {role: button, name: Edit}
  - wait_for: {text: dark-mode, within: {role: application}}
  # Close the side panels the steps do not use, so the diagram is drawn larger.
  - click: {role: button, name: "Collapse panel", nth: 1}
  - click: {role: button, name: "Collapse panel", nth: 0}
  - click: {role: button, name: Fit View}
  # Zoomed out, so what the steps add stays in the picture.
  - click: {role: button, name: Zoom Out}
  - click: {role: button, name: Zoom Out}
steps:
  - note: Select a lane
    do:
      - click: {text: main, exact: true, within: {role: application}}
  - note: Tab adds a commit at its tip
    do:
      - press: Tab
    pause: 1
  - note: Tab adds a commit at its tip
    do:
      - fill: {role: textbox, name: Rename, within: {role: application}, value: v3.2.1}
  - note: Tab again runs the lane out
    do:
      - press: Tab
    pause: 1
  - note: Tab again runs the lane out
    do:
      - fill: {role: textbox, name: Rename, within: {role: application}, value: v3.3.0}
      - press: Enter
    pause: 1.5
