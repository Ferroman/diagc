# Blocks a pull request until its author has signed CLA.md.
#
# This is CLA Assistant *Lite* — an action that runs in this repo, rather than the
# hosted cla-assistant.io service. The difference that matters: signatures are committed
# to this repository (see `path-to-signatures` and `branch`), so the record of who agreed
# to what is yours and survives the service going away. Losing that record would mean
# losing the evidence that the project can be licensed commercially.
#
# A contributor signs by commenting the exact sentence in `custom-pr-sign-comment` on
# their PR. One signature covers all their future contributions.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# `pull_request_target` runs with a writable token against the BASE repo, which is what
# lets a fork's PR record a signature. It must never check out or execute code from the
# PR head — this workflow does neither.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # A commit, not a tag: this is the one place the repo hands a writable token to
        # code it does not own, and a tag can be moved to point at something else.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/Ferroman/diagc/blob/main/CLA.md'
          # Not `main`: the action records a signature as a direct commit, and `main` only
          # takes pull requests. The branch has to exist already — the action creates the
          # file on it, not the branch — and a ruleset keeps it from being rewritten or
          # deleted.
          branch: 'cla-signatures'
          # Exact logins only. The action turns a `*` pattern into an unanchored regex, so
          # the `bot*` its README suggests waves through any account with "bot" anywhere
          # in its name — and an unsigned contribution is what this workflow exists to stop.
          allowlist: 'Ferroman,dependabot[bot]'
          custom-notsigned-prcomment: >
            Thanks for the pull request. This project is dual-licensed, so before it can
            be merged we need you to sign the [CLA](https://github.com/Ferroman/diagc/blob/main/CLA.md).
            [CONTRIBUTING.md](https://github.com/Ferroman/diagc/blob/main/CONTRIBUTING.md)
            explains why, and what we commit to in return. You keep your copyright, and
            you only do this once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
