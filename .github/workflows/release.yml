# Versioning and releases, driven by Conventional Commits on main.
#
# release-please keeps one release PR open that bumps the version and writes
# CHANGELOG.md from the commits since the last release. Merging that PR tags vX.Y.Z,
# creates the GitHub release, and then the publish job ships both npm packages.
#
# One version for the whole repo (release-please-config.json): `diagc` bakes in the
# renderer, studio and viewer, so a commit anywhere can change what it ships, and
# `@diagc/core` is published in lockstep with it. The root package.json carries the
# version; `extra-files` copies it into the two published manifests.
name: Release

on:
  push:
    branches: [main]
  # Re-runs publish for a tag that already exists, when the release was cut but the
  # npm upload never happened. Release-please is skipped: the tag and release are there.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.3.0'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        # Pinned to a commit like every third-party action here (see ci.yml).
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `!cancelled()` because a skipped `needs` job skips this one too, which would
    # make the manual run a no-op.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing: npm trusts this workflow over OIDC, so there is no
      # token to store or renew, and every tarball gets a provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # pnpm packs, npm publishes. The pack is where pnpm rewrites publishConfig and
      # `workspace:*` (see CONTRIBUTING.md § Releasing), and each package's prepack rebuilds
      # its dist, so nothing stale ships. The upload goes through npm because its
      # OIDC exchange is the reference one; pnpm's has broken between releases.
      - run: pnpm -r --filter @diagc/core --filter @diagc/cli exec pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"

      # Core first, and the CLI only once npm serves that core. The CLI depends on this exact
      # version of core, so the other way round `npm i @diagc/cli@latest` fails (ETARGET) for
      # the minutes npm takes to process core's upload. npm lists a version minutes before its
      # tarball downloads, so served waits for both. `--prefer-online` asks the registry, not
      # npm's cache. A version already listed is skipped, so a manual run finishes a release
      # that stopped half way.
      - name: Publish @diagc/core, then @diagc/cli
        run: |
          v=$(node -p "require('./package.json').version")
          listed() { [ "$(npm view --prefer-online "$1@$v" version 2>/dev/null)" = "$v" ]; }
          served() { listed "$1" && curl -sfI -o /dev/null "$(npm view --prefer-online "$1@$v" dist.tarball)"; }
          publish() { if listed "$1"; then echo "$1@$v is already on npm"; else npm publish "$2" --access public; fi; }
          publish @diagc/core "$RUNNER_TEMP/tarballs/diagc-core-$v.tgz"
          for _ in $(seq 60); do served @diagc/core && break; sleep 10; done
          served @diagc/core || { echo "npm does not serve @diagc/core@$v after 10 minutes" >&2; exit 1; }
          publish @diagc/cli "$RUNNER_TEMP/tarballs/diagc-cli-$v.tgz"
