# This repo's own use of actions/pr-diagram-diff: a PR that touches a diagram gets a
# comment with before/after pictures. Runs the CLI from this checkout rather than from
# npm, so a PR that changes diagc itself is diffed by its own code.
name: Diagram diff

on:
  pull_request:
    paths: ['.diagrams/src/**']

permissions:
  contents: write # push the pictures to the diagc-diff-assets branch
  pull-requests: write # the comment

concurrency:
  group: diagram-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    # A fork's token can neither push nor comment; the action would skip anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Same pins as ci.yml; see the notes there.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the viewer shell the pages are stamped into
      - run: pnpm build:cli

      - uses: ./actions/pr-diagram-diff
        with:
          diagc: node bin/diagc.mjs
