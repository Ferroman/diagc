# This repo's own use of actions/pr-diagram-diff: a PR that touches a diagram gets a
# comment with before/after pictures. Runs the CLI from this checkout rather than from
# npm, so a PR that changes diagc itself is diffed by its own code.
name: Diagram diff

# No `paths:` filter: a push that takes a PR's diagram change back out must still run,
# or the comment keeps showing a change the PR no longer makes. The first step decides
# instead, before anything is installed.
on:
  pull_request:

permissions:
  contents: write # push the pictures to the diagc-diff-assets branch
  pull-requests: write # the comment

concurrency:
  group: diagram-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    # A fork's token can neither push nor comment; the action would skip anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Run when the PR touches a diagram, or when an earlier push left a comment to update.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- .diagrams/src; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- diagc-diagram-diff -->")) | .id' | head -n 1)
          echo "run=$([ -n "$id" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Same pins as ci.yml; see the notes there.
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # the viewer shell the pages are stamped into
      - if: steps.gate.outputs.run == 'true'
        run: pnpm build:cli

      - if: steps.gate.outputs.run == 'true'
        uses: ./actions/pr-diagram-diff
        with:
          diagc: node bin/diagc.mjs
