# The three checks CONTRIBUTING.md asks for, plus the release build, on every push to
# main and every pull request.
#
# `pull_request` (not `pull_request_target`, which the CLA workflow needs): a fork's PR
# runs with a read-only token and no secrets, so it is safe to check out and execute its
# code here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR makes the run before it pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      # Node 24 is what mise.toml pins for development; `engines` allows >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # What a release ships: both published packages compiled, both browser bundles
      # built and staged into diagc's assets/. Nothing else exercises this path, and a
      # broken emit (the ESM extension fix-up, a bundle that no longer builds) would
      # otherwise surface only at publish time.
      - run: pnpm build:dist
