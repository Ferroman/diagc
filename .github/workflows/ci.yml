# The four checks CONTRIBUTING.md asks for, plus the release build, on every push to
# main and every pull request.
#
# `pull_request` (not `pull_request_target`, which the CLA workflow needs): a fork's PR
# runs with a read-only token and no secrets, so it is safe to check out and execute its
# code here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR makes the run before it pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # release-please's PR only bumps the versions and writes the changelog; the code in it
    # is main's, which this job already passed on push. Skipped at the job, not filtered
    # out of the workflow: `check` is a required status, and a skipped job satisfies it
    # where a workflow that never runs would leave the PR waiting forever.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version comes from `packageManager` in package.json. That pins pnpm 10, which
      # is why this is still `action-setup` and not its successor `pnpm/setup` — that one
      # installs pnpm 11 and newer only.
      #
      # Pinned to a commit because it is not GitHub's own: a tag can be moved, a commit
      # cannot. `actions/*` stay on their major tags — they share a publisher with the
      # runner itself. Dependabot moves the pin (.github/dependabot.yml).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 is what mise.toml pins for development; `engines` allows >= 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # Every diagram source in the repo — the docs' own figures and the examples — still
      # validates. Nothing else compiles them, and the docs embed what they produce.
      - run: pnpm compile

      # What a release ships: both published packages compiled, both browser bundles
      # built and staged into diagc's assets/. Nothing else exercises this path, and a
      # broken emit (the ESM extension fix-up, a bundle that no longer builds) would
      # otherwise surface only at publish time.
      - run: pnpm build:dist

  # The `curl … | sh` installer, for real: it installs the published @diagc/cli from npm
  # (not this branch's code), once with the runner's own Node and once with a downloaded
  # one, on both systems it supports. The unit test (packages/diagc/src/
  # install-script.test.ts) covers its branches against stand-ins; this covers nodejs.org,
  # npm and macOS's userland.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [path, download]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh install.sh
        env:
          DIAGC_NODE: ${{ matrix.node == 'download' && 'download' || '' }}
      - run: ~/.local/bin/diagc --help
